spring:
  application:
    name: onboarding

  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:onboarding}
    username: ${PGUSER:onboarding}
    password: ${PGPASSWORD:onboarding}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

stripe:
  api-key: ${STRIPE_API_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

onboarding:
  payment:
    max-attempts: 3

server:
  port: 8080
